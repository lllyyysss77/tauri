# Tauri Workflow Update Msrv And Propagate

## Action

Follow the update-msrv-and-propagate workflow:
1. Update MSRV version in documentation or change log (e.g., .changes/msrv-*.md).
2. Update MSRV in all Cargo.toml files across the workspace, including examples and templates.
3. Update MSRV in CI workflow files (e.g., .github/workflows/test-*.yml) to ensure tests run on the new MSRV.
4. Commit all changes together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: .changes/msrv-*.md, .github/workflows/test-*.yml, Cargo.toml

